<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow"><title>Owner Dashboard | MrSolveWin</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body class="admin-body">
  <header class="nav wrap"><a class="brand" href="index.html"><span class="brand-mark">S</span><span>MrSolveWin</span></a><a class="text-link" href="index.html">← View website</a></header>
  <main class="admin-wrap">
    <p class="kicker">PRIVATE AREA</p><h1>Owner <span>dashboard.</span></h1>
    <p class="muted">Sign in with the owner account created by your parent or guardian. Never share your password.</p>
    <section class="panel" id="login-panel">
      <h2>Owner sign in</h2>
      <form id="login-form" class="stack">
        <label>Email<input id="email" type="email" autocomplete="username" required></label>
        <label>Password<input id="password" type="password" autocomplete="current-password" required></label>
        <button class="button gold" type="submit">Sign in</button>
      </form>
      <p id="login-message" class="status" aria-live="polite"></p>
    </section>
    <section class="panel hidden" id="dashboard">
      <div class="section-head"><h2>Your videos</h2><button id="logout" class="button ghost" type="button">Sign out</button></div>
      <form id="video-form" class="stack">
        <input id="video-id" type="hidden">
        <label>Video title<input id="title" maxlength="100" required placeholder="My latest Roblox video"></label>
        <label>YouTube video URL<input id="url" type="url" required placeholder="https://www.youtube.com/watch?v=..."></label>
        <label>Description<textarea id="description" maxlength="240" rows="2" placeholder="A short description (optional)"></textarea></label>
        <label class="check"><input id="published" type="checkbox" checked> Show this video publicly</label>
        <div class="hero-actions"><button class="button gold" type="submit" id="save-button">Add video</button><button class="button ghost hidden" type="button" id="cancel-edit">Cancel edit</button></div>
      </form>
      <p id="dashboard-message" class="status" aria-live="polite"></p>
      <div id="admin-list" class="admin-list"></div>
    </section>
  </main>
  <script type="module" src="assets/admin.js"></script>
</body>
</html>
